# Karapace (Apache-2.0, Confluent-REST-API-compatible Schema Registry),
# M14-gke-qa.md §3.3. Stores schemas in the existing kafka-qa broker (a
# compacted topic it creates itself) -- no new PVC. Reached only via
# `kubectl port-forward`, never a public LoadBalancer, same as kafka-qa.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karapace
  namespace: qa-rec
  labels:
    app: karapace
spec:
  replicas: 1
  selector:
    matchLabels: {app: karapace}
  template:
    metadata:
      labels: {app: karapace}
    spec:
      containers:
        - name: karapace
          image: ghcr.io/aiven-open/karapace:5.0.1
          command: ["python3", "-m", "karapace"]
          env:
            - {name: KARAPACE_BOOTSTRAP_URI, value: "kafka-qa:9095"}
            - {name: KARAPACE_PORT, value: "8081"}
            - {name: KARAPACE_HOST, value: "0.0.0.0"}
            - {name: KARAPACE_ADVERTISED_HOSTNAME, value: "localhost"}
            - {name: KARAPACE_REGISTRY_HOST, value: "0.0.0.0"}
            - {name: KARAPACE_REGISTRY_PORT, value: "8081"}
          ports:
            - {containerPort: 8081, name: http}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: karapace
  namespace: qa-rec
spec:
  selector: {app: karapace}
  ports:
    - {port: 8081, targetPort: 8081}
