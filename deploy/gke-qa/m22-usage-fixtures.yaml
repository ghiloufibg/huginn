# M22 QA fixtures for the usage screen (docs/plan/M22-gke-full-qa.md §4.3,
# M21-gke-qa.md §1). polinux/stress holds a known amount of memory or burns a
# known amount of CPU, so the screen can be checked against `kubectl top`.
# Autopilot may rewrite requests and limits: what the cluster really set is
# read back with `kubectl get pod -o yaml` before judging any share.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-mem
  namespace: qa-rec
  labels: {app.kubernetes.io/part-of: usage-mem}
spec:
  replicas: 3
  selector: {matchLabels: {app: usage-mem}}
  template:
    metadata: {labels: {app: usage-mem, app.kubernetes.io/part-of: usage-mem}}
    spec:
      containers:
        - name: stress
          image: polinux/stress:1.0.4
          command: [stress]
          args: ["--vm", "1", "--vm-bytes", "256M", "--vm-hang", "0"]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 250m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-cpu
  namespace: qa-rec
  labels: {app.kubernetes.io/part-of: usage-cpu}
spec:
  replicas: 1
  selector: {matchLabels: {app: usage-cpu}}
  template:
    metadata: {labels: {app: usage-cpu, app.kubernetes.io/part-of: usage-cpu}}
    spec:
      containers:
        - name: stress
          image: polinux/stress:1.0.4
          command: [stress]
          args: ["--cpu", "1"]
          resources:
            requests: {cpu: 500m, memory: 128Mi}
            limits: {cpu: "1", memory: 128Mi}
---
# No explicit limits: shows what Autopilot does with them (finding either way).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-nolimit
  namespace: qa-rec
  labels: {app.kubernetes.io/part-of: usage-nolimit}
spec:
  replicas: 2
  selector: {matchLabels: {app: usage-nolimit}}
  template:
    metadata: {labels: {app: usage-nolimit, app.kubernetes.io/part-of: usage-nolimit}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: [sh, -c, "while true; do sleep 30; done"]
---
# Application container plus a sidecar: the `A` toggle must change the sums.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-sidecar
  namespace: qa-rec
  labels: {app.kubernetes.io/part-of: usage-sidecar}
spec:
  replicas: 2
  selector: {matchLabels: {app: usage-sidecar}}
  template:
    metadata: {labels: {app: usage-sidecar, app.kubernetes.io/part-of: usage-sidecar}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: [sh, -c, "while true; do sleep 30; done"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 100m, memory: 128Mi}
        - name: istio-proxy
          image: polinux/stress:1.0.4
          command: [stress]
          args: ["--vm", "1", "--vm-bytes", "64M", "--vm-hang", "0"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 100m, memory: 128Mi}
---
# Completed Job: not in the usage, not an error.
apiVersion: batch/v1
kind: Job
metadata:
  name: usage-done
  namespace: qa-rec
  labels: {app.kubernetes.io/part-of: usage-done}
spec:
  template:
    metadata: {labels: {app.kubernetes.io/part-of: usage-done}}
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.36
          command: [sh, -c, "echo done"]
---
# A second environment's namespace, to switch to with ctrl+e.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prd-api
  namespace: qa-prd
  labels: {app.kubernetes.io/part-of: prd-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: prd-api}}
  template:
    metadata: {labels: {app: prd-api, app.kubernetes.io/part-of: prd-api}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: [sh, -c, "i=0; while true; do i=$((i+1)); echo \"prd-api line $i\"; sleep 5; done"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 50m, memory: 64Mi}
