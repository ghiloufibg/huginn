# M15 QA fixture (docs/plan/M15-gke-qa.md §2.2): force the kubelet to rotate
# a container's log, to test a range older than what the node keeps (FR-5a).
# Applied only for that case, deleted after. About 1 KB per line, throttled
# to a few hundred lines/s; calibrate at execution and read the node's real
# rotation limit (do not assume GKE's defaults).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: range-flood
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: range-flood
spec:
  replicas: 1
  selector:
    matchLabels: {app: range-flood}
  template:
    metadata:
      labels: {app: range-flood, app.kubernetes.io/part-of: range-flood}
    spec:
      containers:
        - name: range-flood
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              pad=$(printf 'x%.0s' $(seq 1 900))
              i=0
              while true; do
                i=$((i+1))
                printf '{"level":"info","logger_name":"qa.range.flood","message":"seq=%08d %s"}\n' "$i" "$pad"
                sleep 0.004
              done
          resources: {requests: {cpu: 10m, memory: 16Mi}}
