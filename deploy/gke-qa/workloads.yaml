apiVersion: v1
kind: Namespace
metadata:
  name: qa-rec
---
apiVersion: v1
kind: Namespace
metadata:
  name: qa-restricted
---
# payment-service: 2 replicas, real Spring Boot app processing "payments" on a
# schedule, occasionally failing with a real multi-frame stack trace
# (AcquirerTimeoutException). Carries an istio-proxy-style sidecar so the QA
# session can exercise containers.yaml's sidecar-hide list against a real pod,
# same as deploy/lab/workloads.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        app.kubernetes.io/part-of: payment-service
    spec:
      initContainers:
        - name: istio-init
          image: busybox:1.36
          command: ["sh", "-c", "echo istio-init: pretending to install iptables rules && sleep 1"]
      containers:
        - name: payment-service
          image: us-central1-docker.pkg.dev/huginn-kube-tui/huginn-qa/payment-service:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
        - name: istio-proxy
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo '{\"level\":\"info\",\"logger\":\"envoy\",\"message\":\"sidecar heartbeat\"}'; sleep 5; done"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: qa-rec
spec:
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 8080
---
# catalog-indexer: 1 replica, points at an unresolvable database host on
# purpose (see application.properties). Spring's DataSource autoconfiguration
# fails on startup with a real, long Hikari/JDBC stack trace, and the pod
# CrashLoopBackOffs for real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-indexer
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: catalog-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-indexer
  template:
    metadata:
      labels:
        app: catalog-indexer
        app.kubernetes.io/part-of: catalog-indexer
    spec:
      containers:
        - name: catalog-indexer
          image: us-central1-docker.pkg.dev/huginn-kube-tui/huginn-qa/catalog-indexer:1.0
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 384Mi
---
# order-orchestrator: 1 replica, unbounded in-memory backlog (see
# OrderBacklog.java) against a tight container memory limit that matches the
# JVM's -Xmx160m, so the pod is OOMKilled for real (or the JVM exits itself
# first via -XX:+ExitOnOutOfMemoryError).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-orchestrator
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: order-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-orchestrator
  template:
    metadata:
      labels:
        app: order-orchestrator
        app.kubernetes.io/part-of: order-orchestrator
    spec:
      containers:
        - name: order-orchestrator
          image: us-central1-docker.pkg.dev/huginn-kube-tui/huginn-qa/order-orchestrator:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 220Mi
            limits:
              memory: 220Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-orchestrator
  namespace: qa-rec
spec:
  selector:
    app: order-orchestrator
  ports:
    - port: 80
      targetPort: 8080
---
# qa-restricted: a trivial fixture the read-only identity is deliberately NOT
# granted access to (no Role/RoleBinding here), to exercise a real "forbidden"
# response from the Kubernetes API rather than a lab stand-in.
apiVersion: v1
kind: Pod
metadata:
  name: internal-audit
  namespace: qa-restricted
  labels:
    run: internal-audit
    app.kubernetes.io/part-of: internal-audit
spec:
  containers:
    - name: internal-audit
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo '{\"level\":\"info\",\"message\":\"audit sweep complete\"}'; sleep 10; done"]
