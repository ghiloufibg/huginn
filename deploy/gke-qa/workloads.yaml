apiVersion: v1
kind: Namespace
metadata:
  name: qa-rec
---
apiVersion: v1
kind: Namespace
metadata:
  name: qa-restricted
---
# payment-service: 2 replicas, real Spring Boot app processing "payments" on a
# schedule, occasionally failing with a real multi-frame stack trace
# (AcquirerTimeoutException). Carries an istio-proxy-style sidecar so the QA
# session can exercise containers.yaml's sidecar-hide list against a real pod,
# same as deploy/lab/workloads.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        app.kubernetes.io/part-of: payment-service
    spec:
      initContainers:
        - name: istio-init
          image: busybox:1.36
          command: ["sh", "-c", "echo istio-init: pretending to install iptables rules && sleep 1"]
      containers:
        - name: payment-service
          image: us-east1-docker.pkg.dev/huginn-kube-tui/huginn-qa/payment-service:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
        - name: istio-proxy
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo '{\"level\":\"info\",\"logger\":\"envoy\",\"message\":\"sidecar heartbeat\"}'; sleep 5; done"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: qa-rec
spec:
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 8080
---
# catalog-indexer: 1 replica, points at an unresolvable database host on
# purpose (see application.properties). Spring's DataSource autoconfiguration
# fails on startup with a real, long Hikari/JDBC stack trace, and the pod
# CrashLoopBackOffs for real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-indexer
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: catalog-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-indexer
  template:
    metadata:
      labels:
        app: catalog-indexer
        app.kubernetes.io/part-of: catalog-indexer
    spec:
      containers:
        - name: catalog-indexer
          image: us-east1-docker.pkg.dev/huginn-kube-tui/huginn-qa/catalog-indexer:1.0
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 384Mi
---
# order-orchestrator: 1 replica, unbounded in-memory backlog (see
# OrderBacklog.java) against a tight container memory limit that matches the
# JVM's -Xmx160m, so the pod is OOMKilled for real (or the JVM exits itself
# first via -XX:+ExitOnOutOfMemoryError).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-orchestrator
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: order-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-orchestrator
  template:
    metadata:
      labels:
        app: order-orchestrator
        app.kubernetes.io/part-of: order-orchestrator
    spec:
      containers:
        - name: order-orchestrator
          image: us-east1-docker.pkg.dev/huginn-kube-tui/huginn-qa/order-orchestrator:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 220Mi
            limits:
              memory: 220Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-orchestrator
  namespace: qa-rec
spec:
  selector:
    app: order-orchestrator
  ports:
    - port: 80
      targetPort: 8080
---
# payment-service-loadgen: same image as payment-service, deployed a second
# time with its processing interval overridden much lower, to produce real
# sustained log volume for the NFR pass without a second application. See
# docs/plan/M10-gke-qa.md §3.4.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-loadgen
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: payment-service-loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service-loadgen
  template:
    metadata:
      labels:
        app: payment-service-loadgen
        app.kubernetes.io/part-of: payment-service-loadgen
    spec:
      containers:
        - name: payment-service-loadgen
          image: us-east1-docker.pkg.dev/huginn-kube-tui/huginn-qa/payment-service:1.0
          env:
            - name: PAYMENT_PROCESSING_INTERVAL_MS
              value: "150"
          ports:
            - containerPort: 8080
          # Same request shape as payment-service (not 200m): a distinct
          # shape triggered a new Autopilot node-pool bucket that hit this
          # project's zero PREEMPTIBLE_CPUS quota. See noisy-fixture's note
          # below.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
---
# noisy-fixture: a cheap busybox loop (no JVM needed) emitting JSON lines
# shaped for what none of the real services naturally produce: a
# non-standard level field (level_from, M7), a non-default pairs syntax
# (pair_pattern, M6.1/M6.2), and an embedded fake email/bearer token to
# exercise ui.yaml's redact (D-050) in a copy/save. See
# docs/plan/M10-gke-qa.md §3.3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noisy-fixture
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: noisy-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noisy-fixture
  template:
    metadata:
      labels:
        app: noisy-fixture
        app.kubernetes.io/part-of: noisy-fixture
    spec:
      containers:
        - name: noisy-fixture
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo '{"sev":"info","message":"user: \"carol\"; action: \"browse\"; route: \"/v1/catalog\"; status: \"200\"; - Catalog page viewed"}'
                sleep 4
                echo '{"sev":"warn","message":"user: \"alice\"; action: \"login\"; route: \"/v1/login\"; status: \"200\"; - User signed in (contact alice.debug@example.invalid, token Bearer aaaaaaaaaaaaaaaaaaaa1111)"}'
                sleep 4
                echo '{"sev":"error","message":"user: \"bob\"; action: \"checkout\"; route: \"/v1/checkout\"; status: \"500\"; - Payment gateway unreachable"}'
                sleep 4
              done
          # Matches payment-service's own request shape on purpose (a
          # busybox loop needs far less): a distinct cpu/memory shape from
          # every already-scheduled pod made Autopilot provision a new,
          # separate node-pool bucket, which hit this project's zero
          # PREEMPTIBLE_CPUS quota on its first M10 run. Reusing an
          # already-proven shape packs onto the existing node instead.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
# qa-restricted: a trivial fixture the read-only identity is deliberately NOT
# granted access to (no Role/RoleBinding here), to exercise a real "forbidden"
# response from the Kubernetes API rather than a lab stand-in.
apiVersion: v1
kind: Pod
metadata:
  name: internal-audit
  namespace: qa-restricted
  labels:
    run: internal-audit
    app.kubernetes.io/part-of: internal-audit
spec:
  containers:
    - name: internal-audit
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo '{\"level\":\"info\",\"message\":\"audit sweep complete\"}'; sleep 10; done"]
