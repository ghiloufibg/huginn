      labels: {app: deploy-forbidden, app.kubernetes.io/part-of: deploy-forbidden}
    spec:
      containers:
        - name: deploy-forbidden
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo '{\"level\":\"info\",\"message\":\"deploy-forbidden\"}'; sleep 10; done"]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
