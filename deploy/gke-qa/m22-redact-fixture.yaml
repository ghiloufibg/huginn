# M22: a service that logs an e-mail address and a bearer token, which the
# `redact` patterns of ui.yaml must hide on copy and save (N-17, L-8).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redact-emitter
  namespace: qa-rec
  labels: {app.kubernetes.io/part-of: redact-emitter}
spec:
  replicas: 1
  selector: {matchLabels: {app: redact-emitter}}
  template:
    metadata: {labels: {app: redact-emitter, app.kubernetes.io/part-of: redact-emitter}}
    spec:
      containers:
        - name: redact-emitter
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                printf '{"timestamp":"%s","level":"INFO","logger":"qa.redact","message":"user alice.smith@example.com called with Bearer eyJhbGciOi.QA-TOKEN-%d.sig line %d"}\n' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" "$i" "$i"
                sleep 3
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
