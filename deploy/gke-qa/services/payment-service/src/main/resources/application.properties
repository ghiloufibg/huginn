spring.application.name=payment-service
server.port=8080

# Overridden via PAYMENT_PROCESSING_INTERVAL_MS on the payment-service-loadgen
# deployment (docs/plan/M10-gke-qa.md §3.4); default matches the original
# hardcoded values so payment-service itself is unaffected.
payment.processing.interval-ms=4000
payment.processing.initial-delay-ms=5000

logging.structured.format.console=logstash
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.tracing.sampling.probability=1.0
