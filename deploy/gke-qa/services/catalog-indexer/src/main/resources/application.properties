spring.application.name=catalog-indexer

logging.structured.format.console=logstash

# Intentionally unresolvable host: fails fast during HikariCP pool init with
# a real, long, multi-frame stack trace (UnknownHostException wrapped by
# HikariPool / Spring's DataSource auto-configuration).
spring.datasource.url=jdbc:postgresql://catalog-db.qa-rec.svc.cluster.local:5432/catalog
spring.datasource.username=catalog
spring.datasource.password=catalog
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=none
