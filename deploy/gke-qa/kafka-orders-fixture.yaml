# A minimal Kubernetes-visible repository for M12's services screen, so
# the K marker / M key have somewhere to attach (M11-kafka.md's feature
# itself needs no Kubernetes call, but the services screen row it marks
# does). No Kafka logic here -- just a name the kafka/ profile's `repos:`
# section matches, same role as examples/config-kafka's "orders" repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: qa-rec
  labels:
    app.kubernetes.io/part-of: orders
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders, app.kubernetes.io/part-of: orders }
    spec:
      containers:
        - name: orders
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo '{\"level\":\"info\",\"message\":\"orders service heartbeat\"}'; sleep 10; done"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
