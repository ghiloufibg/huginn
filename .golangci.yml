version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    forbidigo:
      # docs/DECISIONS.md D-057: the Kafka adapter is read only. These
      # franz-go calls write to a cluster or join a consumer group; the
      # adapter's guard refuses them at runtime too.
      analyze-types: true
      forbid:
        - pattern: '^kgo\.(ConsumerGroup|ProduceRequestTimeout|TransactionalID|AllowAutoTopicCreation|DefaultProduceTopic|RequiredAcks)$'
          msg: "read only (D-057): no consumer group, no produce, no topic creation"
        - pattern: '\.(Produce|ProduceSync|TryProduce|CommitOffsets|CommitOffsetsSync|CommitRecords|CommitUncommittedOffsets|CommitMarkedOffsets|BeginTransaction|EndTransaction|AbortBufferedRecords)$'
          pkg: '^github\.com/twmb/franz-go/pkg/kgo$'
          msg: "read only (D-057): never produce or commit"
        - pattern: '^kmsg\.NewPtr(Produce|OffsetCommit|JoinGroup|SyncGroup|Heartbeat|CreateTopics|DeleteTopics|DeleteRecords|InitProducerID|AddPartitionsToTxn|EndTxn|CreatePartitions|AlterConfigs|IncrementalAlterConfigs)Request$'
          msg: "read only (D-057): only Metadata, ListOffsets and Fetch requests are sent"
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
    depguard:
      rules:
        # docs/ARCHITECTURE.md rule 1: the core depends on the standard
        # library and on itself only. internal/archtest enforces the full
        # rule set; this gives the same feedback inside editors.
        core:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: "github.com/ghiloufibg/huginn/internal/adapters"
              desc: "the core must not import adapters (hexagonal architecture)"
            - pkg: "github.com/ghiloufibg/huginn/internal/bootstrap"
              desc: "the core must not import the composition root"
            - pkg: "github.com/ghiloufibg/huginn/internal/config"
              desc: "adapters receive their configuration; the core never reads it"
            - pkg: "k8s.io"
              desc: "Kubernetes types stay in the kubernetes adapter"
            - pkg: "charm.land"
              desc: "UI libraries stay in the tui adapter"
            - pkg: "github.com/charmbracelet"
              desc: "UI libraries stay in the tui adapter"
            - pkg: "github.com/spf13"
              desc: "CLI libraries stay in the cli adapter"
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests write records to an in-memory cluster and prove the guard
      # refuses a produce request: they may use what the code may not.
      - path: _test\.go
        linters: [forbidigo]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ghiloufibg/huginn
